<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control de Inasistencias Docentes</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    /* Estilos exclusivos para la impresión / Guardado en PDF */
    @media print {
      body {
        background-color: white !important;
        color: black !important;
      }
      header, .no-print {
        display: none !important;
      }
      main {
        display: block !important;
        max-width: 100% !important;
        margin: 0 !important;
        padding: 0 !important;
      }
      .print-only-header {
        display: block !important;
        margin-bottom: 20px;
        border-bottom: 2px solid #333;
        padding-bottom: 10px;
      }
      #resultsSection {
        border: none !important;
        box-shadow: none !important;
        padding: 0 !important;
      }
      .card-item {
        border: 1px solid #ccc !important;
        background-color: #f9f9f9 !important;
        break-inside: avoid;
      }
    }
    
    .print-only-header {
      display: none;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen">

  <header class="bg-indigo-700 text-white shadow-lg py-4 px-6 mb-8">
    <div class="max-w-6xl mx-auto flex justify-between items-center">
      <h1 class="text-2xl font-bold flex items-center gap-2">
        <img src="escudo.png" alt="Escudo Escuela" class="h-16 w-auto inline-block mr-2"> Escuela Secundaria No 228. "Edmundo O' Gorman"  /  Control de coberturas por inasistencias docentes
      </h1>
      <span class="text-[8px] bg-indigo-800 px-3 py-1 rounded-full border border-indigo-500">Conectado a Google Sheets</span>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 grid grid-cols-1 md:grid-cols-3 gap-6">
    
    <!-- Encabezado visible solo en la impresión/PDF -->
    <div class="print-only-header col-span-3">
      <h1 class="text-2xl font-bold text-slate-900">Reporte de disciplinas y drupos desatendidos</h1>
      <p class="text-sm text-slate-600" id="printDocenteInfo">Docente: --</p>
      <p class="text-sm text-slate-600" id="printFechaInfo">Fecha: --</p>
    </div>

    <!-- Panel de Filtro/Inasistencia (Se oculta al imprimir) -->
    <section class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 h-fit no-print">
      <h2 class="text-lg font-semibold text-slate-700 mb-4 flex items-center gap-2">
        <i class="fa-solid fa-calendar-minus text-indigo-600"></i> Consultar falta
      </h2>
      
      <form id="absenceForm" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-slate-600 mb-1">Fecha de inasistencia</label>
          <input type="date" id="selectDate" required class="w-full border border-slate-300 rounded-lg p-2.5 focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-600 mb-1">Docente ausente</label>
          <select id="selectTeacher" required class="w-full border border-slate-300 rounded-lg p-2.5 focus:ring-2 focus:ring-indigo-500 outline-none">
            <option value="">Cargando plantilla docente...</option>
          </select>
        </div>

        <button type="submit" id="searchBtn" disabled class="w-full bg-indigo-600 hover:bg-indigo-700 disabled:bg-slate-300 text-white font-medium py-2.5 rounded-lg transition-colors flex items-center justify-center gap-2">
          <i class="fa-solid fa-search"></i> Buscar clases afectadas
        </button>
      </form>
    </section>

    <!-- Panel de Resultados -->
    <section id="resultsSection" class="md:col-span-2 bg-white p-6 rounded-xl shadow-sm border border-slate-200">
      <div class="flex justify-between items-center mb-4 pb-2 border-b border-slate-100">
        <div>
          <h2 class="text-lg font-semibold text-slate-700">Disciplinas desatendidas</h2>
          <span id="dayLabel" class="text-sm font-medium text-indigo-600 bg-indigo-50 px-2 py-0.5 rounded-md mt-1 inline-block"></span>
        </div>

        <!-- Botón para imprimir / PDF -->
        <button id="printBtn" onclick="window.print()" class="no-print hidden bg-slate-800 hover:bg-slate-900 text-white text-sm font-medium px-4 py-2 rounded-lg transition-colors flex items-center gap-2">
          <i class="fa-solid fa-file-pdf"></i> Imprimir / Guardar PDF
        </button>
      </div>

      <div id="resultsContainer" class="space-y-3">
        <p class="text-slate-400 text-center py-8">Cargando información del plantel desde Google Sheets...</p>
      </div>
    </section>

  </main>

 <script>
    // ============================================================
    // REEMPLAZA ESTA VARIABLE CON EL ID DE TU HOJA DE GOOGLE SHEETS
    // ============================================================
    const SPREADSHEET_ID = "1Q_3wpX7wjTGaVgGs9-tVINVmnN1WA_Oy-D3iHwN_FzM"; // Tu ID entre comillas

    let docentes = [];
    let cargaHoraria = [];
    const diasSemana = ["Domingo", "Lunes", "Martes", "Miércoles", "Jueves", "Viernes", "Sábado"];

    // Función compatible con archivos locales (file:///) mediante JSONP
    function getSheetData(sheetName) {
      return new Promise((resolve, reject) => {
        const callbackName = 'cb_' + Math.random().toString(36).substring(2, 9);
        
        window[callbackName] = function(data) {
          delete window[callbackName];
          document.body.removeChild(script);
          if (data && data.table && data.table.rows) {
            const rows = data.table.rows.map(row => 
              row.c ? row.c.map(cell => (cell && cell.v !== null && cell.v !== undefined) ? cell.v : "") : []
            );
            resolve(rows);
          } else {
            reject(new Error("Formato de respuesta no válido"));
          }
        };

        const script = document.createElement('script');
        script.src = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=responseHandler:${callbackName}&sheet=${encodeURIComponent(sheetName)}`;
        script.onerror = () => {
          delete window[callbackName];
          document.body.removeChild(script);
          reject(new Error(`No se pudo cargar la pestaña ${sheetName}`));
        };
        document.body.appendChild(script);
      });
    }

    // Cargar datos al iniciar la aplicación
    document.addEventListener("DOMContentLoaded", async () => {
      document.getElementById("selectDate").valueAsDate = new Date();
      const resultsContainer = document.getElementById("resultsContainer");

      try {
        const [rawDocentes, rawHorarios] = await Promise.all([
          getSheetData("Docentes"),
          getSheetData("Horarios")
        ]);

        docentes = rawDocentes
          .filter(row => row[0] && String(row[0]).toLowerCase() !== "id")
          .map(row => ({ id: parseInt(row[0]), nombre: row[1] }));

        cargaHoraria = rawHorarios
          .filter(row => row[0] && String(row[0]).toLowerCase() !== "docenteid")
          .map(row => ({
            docenteId: parseInt(row[0]),
            dia: parseInt(row[1]),
            modulo: String(row[2]),
            grupo: String(row[3]),
            asignatura: String(row[4]),
            aula: String(row[5])
          }));

        const teacherSelect = document.getElementById("selectTeacher");
        teacherSelect.innerHTML = '<option value="">-- Seleccionar docente --</option>';
        docentes.forEach(d => {
          const option = document.createElement("option");
          option.value = d.id;
          option.textContent = d.nombre;
          teacherSelect.appendChild(option);
        });

        document.getElementById("searchBtn").disabled = false;
        resultsContainer.innerHTML = '<p class="text-slate-400 text-center py-6">Selecciona una fecha y un docente para desplegar las asignaturas que quedaron sin atención.</p>';

      } catch (error) {
        console.error("Error al cargar Google Sheets:", error);
        resultsContainer.innerHTML = `
          <div class="p-4 bg-red-50 text-red-800 rounded-lg border border-red-200">
            <i class="fa-solid fa-triangle-exclamation mr-2"></i> Error al conectar con Google Sheets. Verifica que el ID del documento sea correcto, que el acceso público esté en "Lector" y que las pestañas se llamen Docentes y Horarios.
          </div>`;
      }
    });

    // Manejo de la consulta
    document.getElementById("absenceForm").addEventListener("submit", (e) => {
      e.preventDefault();
      
      const teacherSelect = document.getElementById("selectTeacher");
      const teacherId = parseInt(teacherSelect.value);
      const teacherName = teacherSelect.options[teacherSelect.selectedIndex].text;
      const dateVal = document.getElementById("selectDate").value;
      
      const dateParts = dateVal.split("-");
      const selectedDate = new Date(dateParts[0], dateParts[1] - 1, dateParts[2]);
      const dayOfWeek = selectedDate.getDay();

      const dayName = diasSemana[dayOfWeek];
      document.getElementById("dayLabel").textContent = `${dayName} (${dateVal})`;

      document.getElementById("printDocenteInfo").textContent = `Docente ausente: ${teacherName}`;
      document.getElementById("printFechaInfo").textContent = `Día/Fecha: ${dayName}, ${dateVal}`;

      const resultsContainer = document.getElementById("resultsContainer");
      const printBtn = document.getElementById("printBtn");
      resultsContainer.innerHTML = "";

      if (dayOfWeek === 0 || dayOfWeek === 6) {
        if(printBtn) printBtn.classList.add("hidden");
        resultsContainer.innerHTML = `
          <div class="p-4 bg-amber-50 text-amber-800 rounded-lg border border-amber-200">
            <i class="fa-solid fa-triangle-exclamation mr-2"></i> La fecha seleccionada corresponde a un fin de semana. No hay clases programadas.
          </div>`;
        return;
      }

      const afectadas = cargaHoraria.filter(h => h.docenteId === teacherId && h.dia === dayOfWeek);

      if (afectadas.length === 0) {
        if(printBtn) printBtn.classList.add("hidden");
        resultsContainer.innerHTML = `
          <div class="p-4 bg-emerald-50 text-emerald-800 rounded-lg border border-emerald-200">
            <i class="fa-solid fa-circle-check mr-2"></i> El docente no tenía clases programadas registradas para los grupos en este día de la semana.
          </div>`;
        return;
      }

      if(printBtn) printBtn.classList.remove("hidden");

      afectadas.forEach(item => {
        const card = document.createElement("div");
        card.className = "card-item flex items-center justify-between p-4 bg-red-50 border-l-4 border-red-500 rounded-r-lg shadow-sm mb-3";
        card.innerHTML = `
          <div>
            <div class="flex items-center gap-2 mb-1">
              <span class="font-bold text-red-900">${item.asignatura}</span>
              <span class="text-xs bg-red-200 text-red-800 font-semibold px-2 py-0.5 rounded">${item.grupo}</span>
            </div>
            <p class="text-sm text-slate-600"><i class="fa-regular fa-clock mr-1"></i> ${item.modulo}</p>
            <p class="text-xs text-slate-500"><i class="fa-solid fa-location-dot mr-1"></i> ${item.aula}</p>
          </div>
          <span class="text-xs font-semibold bg-white text-red-600 border border-red-200 px-3 py-1 rounded-full shadow-sm">
            Sin Atención
          </span>
        `;
        resultsContainer.appendChild(card);
      });
    });
  </script>
</body>
</html>
